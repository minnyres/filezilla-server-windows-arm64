name: Build for Windows ARM64

on:
  push:

jobs:
  build-windows-arm64:
    name: Build
    runs-on: self-hosted
    env:
      llvm_path: "${{ github.workspace }}/llvm-mingw"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y \
            gcc git cmake ninja-build nsis autoconf-archive pkg-config p7zip libtool make colormake gettext automake autoconf autogen autopoint patch wx-common subversion 
          wget https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-*.tar.xz
          rm llvm-mingw-*.tar.xz
          mv llvm-mingw-* llvm-mingw
          wget https://nsis.sourceforge.io/mediawiki/images/4/4a/AccessControl.zip
          wget https://nsis.sourceforge.io/mediawiki/images/0/0f/ExecDos.zip
          7z x AccessControl.zip
          7z x ExecDos.zip
          sudo cp  Plugins/i386-unicode/AccessControl.dll /usr/share/nsis/Plugins/x86-unicode/
          sudo cp  Plugins/x86-unicode/ExecDos.dll /usr/share/nsis/Plugins/x86-unicode/

      - name: Setup a new (or from cache) vcpkg (and does not build any package)
        uses: lukka/run-vcpkg@v11 # Always specify the specific _version_ of the
                                  # action you need, `v11` in this case to stay up
                                  # to date with fixes on the v11 branch
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          
      - name: Install libraries from vcpkg
        run: |
          export PATH=${{ env.llvm_path }}/bin:$PATH
          cd ${{ env.RUNVCPKG_VCPKG_ROOT }}
          # tell vcpkg to only build Release variants of the dependencies
          mkdir triplets_overlay
          cp triplets/community/arm64-mingw-dynamic.cmake triplets_overlay/arm64-mingw-dynamic-release.cmake
          echo "set(VCPKG_BUILD_TYPE release)" >> triplets_overlay/arm64-mingw-dynamic-release.cmake
          # clear buildtrees after each package installation to reduce disk space requirements
          packages="sqlite3 zlib"
          ./vcpkg install \
            --overlay-triplets=triplets_overlay \
            --clean-after-build \
            --triplet=arm64-mingw-dynamic-release \
            $packages

      - name: Build filezilla server
        run: |
          chmod 755 build.sh
          ./build.sh arm64
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filezilla_server_${{ env.filezilla_server_version }}_arm64
          path: |
            ./FileZilla_Server*.exe
            ./filezilla-server-windows*

      - name: Batch release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ./FileZilla_Server*.exe